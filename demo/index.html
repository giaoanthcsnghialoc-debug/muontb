<style>

html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.credit{background:var(--g);color:#fff;text-align:center;font-size:12.5px;padding:4px 8px;letter-spacing:.2px}
header.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}

.bar h1{font-size:17px;margin:0;flex:1;line-height:1.2}
.bar h1 small{display:block;font-weight:400;color:var(--mut);font-size:12.5px}
.demo{background:#fff3cd;color:#8a6200;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700;margin-left:6px;vertical-align:middle}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 10px 8px;max-width:980px;margin:0 auto;scrollbar-width:none}

.tab.on{background:var(--g);color:#fff}
main{max-width:980px;margin:0 auto;padding:14px 12px 120px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--g);border-color:var(--g);color:#fff}
.btn.warn{color:var(--red);border-color:#f0c9c4}
.btn.sm{padding:6px 10px;font-size:13.5px;border-radius:8px}
.btn.big{padding:14px 16px;font-size:16px;width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.ghost{border-color:transparent;background:transparent}
input[type=text],input[type=password],input[type=date],input[type=number],input[type=time],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
label.f{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px;font-weight:600}
.mut{color:var(--mut)}.sm{font-size:13px}

.chip.g{background:var(--g2);border-color:#bfe3d1;color:var(--g)}
.chip.a{background:#fff6e5;border-color:#f3dcae;color:var(--amb)}
.chip.r{background:#fdecea;border-color:#f3c5bf;color:var(--red)}
.chip.b{background:#e8f0fb;border-color:#c6d8f1;color:var(--blue)}
.weekbar{display:flex;align-items:center;gap:6px}
.weekbar .lbl{flex:1;text-align:center;font-weight:700}
.weekbar .lbl small{display:block;font-weight:400;color:var(--mut)}

.tb{display:flex;align-items:center;gap:8px;background:var(--g2);border-radius:9px;padding:7px 10px;margin:5px 0;font-size:14px}

.fchips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}

<script>
/* ===== Đọc lịch báo giảng vnEdu & tiện ích chung (không phụ thuộc giao diện) ===== */
var U = (function () {
  function noAccent(s) {
    return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D');
  }
  function key(s) { return noAccent(s).toLowerCase().replace(/\s+/g, ' ').trim(); }
  function pad(n) { return ('0' + n).slice(-2); }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseYmd(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2], 12); }
  function addDays(s, n) { var d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
  function monday(s) { var d = parseYmd(s); var w = d.getDay(); d.setDate(d.getDate() - ((w + 6) % 7)); return ymd(d); }
  function dmy(s) { if (!s) return ''; var p = String(s).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function dm(s) { var p = String(s).split('-'); return p[2] + '/' + p[1]; }
  function thu(s) { var w = parseYmd(s).getDay(); return w === 0 ? 'Chủ nhật' : 'Thứ ' + (w + 1); }
  function parseDmy(v) {
    var m = String(v || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (!m) return '';
    return m[3] + '-' + pad(+m[2]) + '-' + pad(+m[1]);
  }
  /** Lớp -> điểm trường: 8C1 -> PH1, 7A2 -> PH2, 9A -> DC */
  function siteOfClass(lop) {
    var m = String(lop || '').trim().match(/^(\d+)\s*[A-Za-zĐđ]+\s*(\d*)$/);
    if (!m) return '';
    if (m[2] === '1') return 'PH1';
    if (m[2] === '2') return 'PH2';
    if (m[2] === '') return 'DC';
    return '';
  }
  function gradeOfClass(lop) { var m = String(lop || '').match(/^(\d+)/); return m ? m[1] : ''; }
  function esc(s) {
    return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function rowKey(r) { return r.ngay + '|' + r.buoi + '|' + r.tiet + '|' + r.lop; }
  function slotKey(catalogId, ngay, buoi, tiet) { return catalogId + '|' + ngay + '|' + buoi + '|' + tiet; }

  /** Cắt bớt dòng/cột trống ở cuối lưới. */
  function trimGrid(grid) {
    var g = grid.map(function (r) { return r.map(function (c) { return c === null || c === undefined ? '' : String(c); }); });
    while (g.length && g[g.length - 1].every(function (c) { return c === ''; })) g.pop();
    var w = 0;
    g.forEach(function (r) { for (var i = r.length - 1; i >= 0; i--) if (r[i] !== '') { w = Math.max(w, i + 1); break; } });
    return g.map(function (r) { r = r.slice(0, w); while (r.length < w) r.push(''); return r; });
  }

  /**
   * Phân tích lưới ô của sheet LBG vnEdu.
   * Trả về { meta:{gv,tuan,tuNgay,denNgay,tuanBD}, cols:{...}, hdr, rows:[{r,ngay,buoi,tiet,mon,lop,ppct,bai,trangThai,site}] }
   */
  function parseLBG(grid) {
    grid = trimGrid(grid);
    var hdr = -1;
    for (var i = 0; i < Math.min(grid.length, 30); i++) {
      var ks = grid[i].map(key);
      if (ks.some(function (k) { return k.indexOf('ten bai') >= 0; }) && ks.some(function (k) { return k.indexOf('lop') === 0; })) { hdr = i; break; }
    }
    if (hdr < 0) throw new Error('Không nhận ra file lịch báo giảng (không thấy dòng tiêu đề có cột "Tên bài dạy" và "Lớp"). Hãy dùng file xuất từ vnEdu.');
    var H = grid[hdr].map(key);
    function col(test) { for (var j = 0; j < H.length; j++) if (test(H[j])) return j; return -1; }
    var cols = {
      thu: col(function (k) { return k.indexOf('thu') === 0; }),
      buoi: col(function (k) { return k === 'buoi'; }),
      tiet: col(function (k) { return k.indexOf('tkb') >= 0 || k === 'tiet'; }),
      mon: col(function (k) { return k.indexOf('mon hoc') === 0 || k === 'mon'; }),
      lop: col(function (k) { return k.indexOf('lop') === 0; }),
      ppct: col(function (k) { return k.indexOf('ppct') >= 0; }),
      bai: col(function (k) { return k.indexOf('ten bai') >= 0; }),
      tb: col(function (k) { return k.indexOf('thiet bi') >= 0 || k.indexOf('do dung') >= 0; }),
      tt: col(function (k) { return k.indexOf('trang thai') >= 0; })
    };
    // Cột mã "2-1" (thứ-buổi) của vnEdu
    var code = -1;
    for (var c = 0; c < (grid[hdr + 1] || []).length; c++) {
      if (/^\d-\d$/.test(String(grid[hdr + 1][c]).trim())) { code = c; break; }
    }
    if (cols.tb < 0) { cols.tb = grid[hdr].length; grid.forEach(function (r) { r.push(''); }); grid[hdr][cols.tb] = 'Trang thiết bị sử dụng'; }

    var meta = { gv: '', tuan: '', tuNgay: '', denNgay: '' };
    for (var r0 = 0; r0 < hdr; r0++) {
      var row = grid[r0];
      for (var j = 0; j < row.length; j++) {
        var k = key(row[j]);
        var next = function () { for (var t = j + 1; t < row.length; t++) if (String(row[t]).trim() !== '') return String(row[t]).trim(); return ''; };
        if (k.indexOf('giao vien') === 0 && !meta.gv) meta.gv = next();
        if (k.indexOf('tuan') === 0 && !meta.tuan) { var m = next().match(/\d+/) || k.match(/\d+/); if (m) meta.tuan = m[0]; }
        if ((k.indexOf('tu ngay') >= 0 || k.indexOf('tu ngay') >= 0 || /^t.? ngay/.test(k)) && !meta.tuNgay) meta.tuNgay = parseDmy(next());
        if (k.indexOf('den ngay') >= 0 && !meta.denNgay) meta.denNgay = parseDmy(next());
      }
    }
    // Ngày theo thứ, đọc thêm từ cột "Thứ, ngày" phòng khi thiếu "Từ ngày"
    var dateByThu = {}, curThu = null, curBuoi = null;
    var rows = [];
    for (var r = hdr + 1; r < grid.length; r++) {
      var g = grid[r];
      var cd = code >= 0 ? String(g[code]).trim() : '';
      var mm = cd.match(/^(\d)-(\d)$/);
      var a0 = cols.thu >= 0 ? String(g[cols.thu]).trim() : '';
      if (mm) { curThu = +mm[1]; curBuoi = mm[2] === '1' ? 'Sáng' : 'Chiều'; }
      else {
        if (/^\d$/.test(a0)) curThu = +a0;
        if (key(a0) === 'cn') curThu = 8;
        var b0 = cols.buoi >= 0 ? key(g[cols.buoi]) : '';
        if (b0 === 'sang') curBuoi = 'Sáng';
        if (b0 === 'chieu') curBuoi = 'Chiều';
      }
      var d = parseDmy(a0);
      if (d && curThu) dateByThu[curThu] = d;
      if (!mm && !String(g[cols.tiet] || '').trim()) {
        if (rows.length && key(g[0]).indexOf('duyet') >= 0) break;
        continue;
      }
      var tiet = parseInt(String(g[cols.tiet] || '').trim(), 10);
      if (!curThu || !curBuoi || !tiet) continue;
      var mon = String(g[cols.mon] || '').trim(), lop = String(g[cols.lop] || '').trim();
      var tt = cols.tt >= 0 ? String(g[cols.tt] || '').trim() : '';
      rows.push({ r: r, thuSo: curThu, buoi: curBuoi, tiet: tiet, mon: mon, lop: lop,
        ppct: cols.ppct >= 0 ? String(g[cols.ppct] || '').trim() : '', bai: String(g[cols.bai] || '').trim(),
        trangThai: tt, day: !!(mon || lop) && key(tt) !== 'nghi' });
    }
    var start = meta.tuNgay;
    if (!start) {
      var anyThu = Object.keys(dateByThu)[0];
      if (anyThu) start = addDays(dateByThu[anyThu], -(+anyThu - 2));
    }
    if (!start) throw new Error('Không đọc được ngày của tuần trong lịch báo giảng.');
    meta.tuanBD = monday(start);
    rows.forEach(function (x) {
      x.ngay = addDays(meta.tuanBD, x.thuSo - 2);
      x.site = siteOfClass(x.lop);
      x.key = rowKey(x);
    });
    return { grid: grid, hdr: hdr, cols: cols, meta: meta, rows: rows };
  }

  return { noAccent: noAccent, key: key, pad: pad, ymd: ymd, parseYmd: parseYmd, addDays: addDays, monday: monday,
    dmy: dmy, dm: dm, thu: thu, parseDmy: parseDmy, siteOfClass: siteOfClass, gradeOfClass: gradeOfClass, esc: esc,
    rowKey: rowKey, slotKey: slotKey, trimGrid: trimGrid, parseLBG: parseLBG };
})();


/* ===== Xuất file Excel (ExcelJS) ===== */
var EX = (function () {
  var THIN = { style: 'thin' };
  var BORDER = { top: THIN, left: THIN, bottom: THIN, right: THIN };
  var FONT = 'Times New Roman';
  var SITE_NAME = { DC: 'Điểm chính', PH1: 'Phân hiệu 1', PH2: 'Phân hiệu 2' };
  var STATUS = { CHO_GIAO: 'Chờ giao', DA_GIAO: 'Đã giao – chưa trả', DA_TRA: 'Đã trả', TU_CHOI: 'Từ chối' };

  function fontAll(ws, size) {
    ws.eachRow({ includeEmpty: true }, function (row) {
      row.eachCell({ includeEmpty: true }, function (c) {
        c.font = Object.assign({ name: FONT, size: size || 12 }, c.font || {}, { name: FONT });
      });
    });
  }
  function box(ws, r1, r2, c1, c2) {
    for (var r = r1; r <= r2; r++) for (var c = c1; c <= c2; c++) {
      var cell = ws.getCell(r, c);
      cell.border = BORDER;
      cell.alignment = Object.assign({ vertical: 'middle', wrapText: true }, cell.alignment || {});
    }
  }
  function title(ws, r, text, c1, c2, size, bold) {
    ws.mergeCells(r, c1, r, c2);
    var c = ws.getCell(r, c1);
    c.value = text;
    c.font = { name: FONT, size: size || 12, bold: bold !== false };
    c.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
  }
  function safeSheetName(s, used) {
    var n = String(s).replace(/[\[\]\*\?\/\\:]/g, ' ').slice(0, 28).trim() || 'Sheet';
    var b = n, i = 2;
    while (used[n]) n = (b.slice(0, 25) + ' ' + (i++));
    used[n] = 1;
    return n;
  }
  function tbText(list) {
    return list.map(function (x) { return x.tenTB + (Number(x.soLuong) > 1 ? ' (' + x.soLuong + ')' : ''); }).join('; ');
  }
  async function save(wb, filename) {
    var buf = await wb.xlsx.writeBuffer();
    var blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  }

  /** 1) Lịch báo giảng đã điền cột "Trang thiết bị sử dụng". itemsByRow: rowIndex -> [items] */
  function buildLBG(p, itemsByRow) {
    var wb = new ExcelJS.Workbook();
    var ws = wb.addWorksheet('LBG', { pageSetup: { paperSize: 9, orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0 } });
    var grid = p.grid, W = grid[0].length;

      '<label class="f">Nhập lại mật khẩu mới</label><input type="password" id="np2">',

  /* ---------- khung ứng dụng ---------- */

  async function start() {

  /* =================== GIÁO VIÊN: BÁO MƯỢN =================== */
  function defaultWeek() {
    var t = S.boot.today, w = U.parseYmd(t).getDay();
    return (w === 6 || w === 0) ? U.addDays(U.monday(t), 7) : U.monday(t);
  }

  async function loadGV(tuanBD, keep) {
    var j = await call('myWeek', { tuanBD: tuanBD });
    if (!j) return;
    var g = { tuanBD: tuanBD, week: j.week, usage: j.usage || {}, parsed: null, rows: [], sel: {}, dirty: false };
    if (j.hayDung) S.boot.hayDung = j.hayDung;
    if (j.lbg) { try { g.parsed = U.parseLBG(j.lbg); } catch (e) { g.parsed = null; } }
    if (keep && keep.parsed) { g.parsed = keep.parsed; g.dirty = true; }
    if (g.parsed) g.rows = g.parsed.rows.filter(function (r) { return r.day; }).map(function (r) { return Object.assign({}, r); });
    j.items.forEach(function (it) {
      var k = U.rowKey({ ngay: it.ngay, buoi: it.buoi, tiet: Number(it.tiet), lop: it.lop });
      if (!g.rows.some(function (r) { return r.key === k; })) {
        g.rows.push({ key: k, ngay: it.ngay, buoi: it.buoi, tiet: Number(it.tiet), lop: it.lop, mon: it.mon, ppct: it.tietPPCT, bai: it.tenBai, site: it.diemTruong, manual: true });
      }
      (g.sel[k] = g.sel[k] || []).push({ id: it.id, catalogId: it.catalogId, soLuong: Number(it.soLuong), hinhThuc: it.hinhThuc, trangThai: it.trangThai, lyDo: it.lyDo, tenTB: it.tenTB, site: it.diemTruong });
    });
    sortRows(g.rows);
    S.gv = g;
    await fetchHints();
  }
  function sortRows(rows) {
    rows.sort(function (a, b) {
      var x = a.ngay + (a.buoi === 'Sáng' ? 1 : 2) + U.pad(a.tiet), y = b.ngay + (b.buoi === 'Sáng' ? 1 : 2) + U.pad(b.tiet);
      return x < y ? -1 : x > y ? 1 : 0;
    });
  }

  async function viewBao(v) {
    if (!S.gv) await loadGV(defaultWeek());
    if (!S.gv) { v.innerHTML = '<div class="empty">Không tải được dữ liệu.</div>'; return; }
    renderBao(v);
  }

  function renderBao(v) {
    v = v || document.getElementById('v');

      w.trangThai === 'KHONG_MUON' ? '<span class="chip">Đã báo: không mượn · ' + esc(w.guiLuc) + '</span>' :
        '<span class="chip g">Đã gửi · ' + esc(w.guiLuc) + '</span>';
    var nSel = 0;
    Object.keys(g.sel).forEach(function (k) { nSel += g.sel[k].length; });
    var h = '<div class="card"><div class="weekbar"><button class="btn sm" id="wp">◀</button><div class="lbl">' + weekLabel(g.tuanBD) +
      '</div><button class="btn sm" id="wn">▶</button></div><div style="text-align:center;margin-top:8px">' + st +
      (g.dirty ? ' <span class="chip r">Chưa gửi thay đổi</span>' : '') + '</div></div>';

    var retToday = [];
    g.rows.forEach(function (r) { if (r.ngay === S.boot.today) (g.sel[r.key] || []).forEach(function (x) { if (canReturn(x, r)) retToday.push(x.id); }); });
    if (retToday.length) h += '<div class="note row"><span class="grow">Hôm nay thầy/cô đang mượn <b>' + retToday.length + '</b> thiết bị. Dạy xong, trả đồ rồi bấm báo trả.</span><button class="btn sm pri" id="retall">↩ Báo trả tất cả</button></div>';
    var wd = U.parseYmd(S.boot.today).getDay();
    if (g.tuanBD === U.monday(S.boot.today) && (wd === 5 || wd === 6 || wd === 0)) {
      h += '<div class="note row"><span class="grow">Đang xem <b>tuần ' + weekNo(g.tuanBD) + '</b> (tuần hiện tại). Báo mượn cho tuần sau?</span><button class="btn sm pri" id="gonext">Sang tuần ' + (weekNo(g.tuanBD) + 1) + ' ▶</button></div>';
    }
    var nr = (S.boot.rules || []).length;
    h += '<div style="margin:-4px 0 10px"><button class="btn sm" id="rules">📌 Mượn cố định' + (nr ? ' (' + nr + ')' : '') + '</button></div>';
    h += '<div class="row" style="margin-bottom:12px"><button class="btn pri grow" id="up">📄 Tải lịch báo giảng lên</button>' +
      '<button class="btn grow" id="km">🚫 Tuần ' + weekNo(g.tuanBD) + ' không mượn</button></div>';

    if (g.parsed && U.key(g.parsed.meta.gv) && U.key(g.parsed.meta.gv) !== U.key(S.boot.me.hoTen)) {
      h += '<div class="note">Lịch báo giảng này của <b>' + esc(g.parsed.meta.gv) + '</b>, không trùng tên tài khoản đang đăng nhập.</div>';
    }
    if (!g.rows.length) {
      h += '<div class="card empty">Tải lịch báo giảng (file xuất từ vnEdu) để chọn thiết bị cho từng tiết.<br><br>' +
        '<b>Chưa có lịch báo giảng tuần ' + weekNo(g.tuanBD) + '?</b> Lấy lịch báo giảng tuần ' + (weekNo(g.tuanBD) - 1) + ' để mượn trước, khi có lịch báo giảng tuần ' + weekNo(g.tuanBD) + ' thì tải lên sau.<br><br>' +
        '<button class="btn pri sm" id="tkb">📅 Lấy lịch báo giảng tuần ' + (weekNo(g.tuanBD) - 1) + '</button> ' +
        '<button class="btn sm" id="man">+ Thêm tiết dạy thủ công</button><br><br>' +
        '<span class="sm">Tuần nào không dùng thiết bị, chỉ cần bấm <b>“Tuần ' + weekNo(g.tuanBD) + ' không mượn”</b>.</span></div>';
    } else {
      var lastDay = '';
      g.rows.forEach(function (r, i) {
        if (r.ngay !== lastDay) { h += '<div class="day">' + U.thu(r.ngay) + ' – ' + U.dmy(r.ngay) + '</div>'; lastDay = r.ngay; }
        var list = g.sel[r.key] || [];
        h += '<div class="lesson"><div class="hd"><span class="t">' + r.buoi + ' · Tiết ' + r.tiet + ' · ' + esc(r.lop) + '</span>' +
          '<span class="mut">' + esc(r.mon) + (r.ppct ? ' · PPCT ' + esc(r.ppct) : '') + '</span>' +
          (r.site ? '<span class="chip sm">' + esc(siteName(r.site)) + '</span>' : '') + '</div>' +
          '<div class="bai">' + (r.bai ? esc(r.bai) : '<i>Chưa có tên bài</i>') + (r.manual ? ' <button class="btn ghost sm" data-ed="' + i + '" title="Sửa tiết PPCT / tên bài">✏️</button>' : '') + '</div>';
        list.forEach(function (x, j) {
          var lock = x.trangThai && x.trangThai !== 'CHO_GIAO';
          h += '<div class="tb' + (x.trangThai === 'TU_CHOI' ? ' rej' : lock ? ' lock' : '') + '"><span class="grow">' + esc(x.tenTB) + (x.catalogId ? '' : ' ✍️') + ' <b>×' + x.soLuong + '</b>' +
            '<span class="mut sm"> · ' + esc(x.hinhThuc) + '</span>' + (x.trangThai === 'TU_CHOI' && x.lyDo ? '<br><span class="sm">Lý do: ' + esc(x.lyDo) + '</span>' : '') + '</span>' +
            (x.trangThai ? chipStatus(x.trangThai) : '') +
            (canReturn(x, r) ? '<button class="btn sm" data-ret="' + i + ':' + j + '">↩ Đã trả</button>' : '') +
            (!lock || x.trangThai === 'TU_CHOI' ? '<button class="x" data-rm="' + i + ':' + j + '" title="Bỏ">×</button>' : '') + '</div>';
        });
        if (!list.length) {
          var hs = hintsFor(r);
          if (hs.length) h += '<div class="hint">💡 Bài này thường dùng: ' + hs.map(function (x) { return esc(x.c.ten) + ' ×' + x.soLuong; }).join(', ') +
            ' <button class="btn sm" data-hint="' + i + '">Mượn giống vậy</button></div>';
        }
        h += '<button class="btn sm" data-add="' + i + '">+ Thiết bị</button></div>';
      });
      h += '<div style="margin-top:10px"><button class="btn sm" id="man">+ Thêm tiết dạy thủ công</button></div>';
      h += '<div class="card" style="margin-top:14px"><h2>Tải file về</h2><div class="row">' +
        (g.parsed ? '<button class="btn sm" id="dl1">⬇ Lịch báo giảng đã điền thiết bị</button>' : '') +
        '<button class="btn sm" id="dl2">⬇ Phiếu báo mượn tuần</button></div>' +
        '<p class="mut sm" style="margin:8px 0 0">Nhân viên thiết bị đã thấy phiếu ngay trên ứng dụng khi bạn bấm Gửi, không cần gửi file.</p></div>';
      h += '<div class="sticky"><div class="in"><button class="btn pri big" id="send">Gửi cho nhân viên thiết bị (' + nSel + ' thiết bị)</button></div></div>';
    }
    v.innerHTML = h;

    v.querySelector('#wp').onclick = function () { switchWeek(U.addDays(g.tuanBD, -7)); };
    v.querySelector('#wn').onclick = function () { switchWeek(U.addDays(g.tuanBD, 7)); };
    v.querySelector('#up').onclick = function () { pickFile('.xls,.xlsx', uploadLBG); };
    v.querySelector('#km').onclick = noBorrow;
    var gn = v.querySelector('#gonext'); if (gn) gn.onclick = function () { switchWeek(U.addDays(g.tuanBD, 7)); };
    var man = v.querySelector('#man'); if (man) man.onclick = manualRow;
    var tkb = v.querySelector('#tkb'); if (tkb) tkb.onclick = copyPrevTKB;
    v.querySelector('#rules').onclick = rulesModal;
    v.querySelectorAll('[data-hint]').forEach(function (b) {
      b.onclick = function () {
        var r = g.rows[+b.dataset.hint], n = 0, miss = [];
        hintsFor(r).forEach(function (x) {
          var a = availFor(x.c, r);
          if (a < 1) { miss.push(x.c.ten); return; }
          addSel(r, x.c, Math.min(x.soLuong, a), x.c.loai === 'Phòng học bộ môn' ? 'Phòng thực hành' : 'Tại lớp', null); n++;
        });
        g.dirty = true; renderBao();
        toast('Đã thêm ' + n + ' thiết bị' + (miss.length ? '. Hết: ' + miss.join(', ') : ''));
      };
    });
    v.querySelectorAll('[data-ed]').forEach(function (b) { b.onclick = function () { editRow(g.rows[+b.dataset.ed]); }; });
    v.querySelectorAll('[data-add]').forEach(function (b) { b.onclick = function () { openPicker(g.rows[+b.dataset.add]); }; });
    v.querySelectorAll('[data-rm]').forEach(function (b) {
      b.onclick = function () {
        var p = b.dataset.rm.split(':'), r = g.rows[+p[0]];

        if (!g.sel[r.key].length) delete g.sel[r.key];
        g.dirty = true; renderBao();
      };
    });
    v.querySelectorAll('[data-ret]').forEach(function (b) {
      b.onclick = function () { var p = b.dataset.ret.split(':'), x = g.sel[g.rows[+p[0]].key][+p[1]]; returnModal([x.id], x.tenTB + ' ×' + x.soLuong); };
    });

    var s = v.querySelector('#send'); if (s) s.onclick = sendWeek;
    var d1 = v.querySelector('#dl1'); if (d1) d1.onclick = dlLBG;
    var d2 = v.querySelector('#dl2'); if (d2) d2.onclick = dlPhieuGV;
  }

  function canReturn(x, r) {
    return !!x.id && (x.trangThai === 'DA_GIAO' || (x.trangThai === 'CHO_GIAO' && r.ngay <= S.boot.today));
  }
  function returnModal(ids, label) {
    if (S.gv.dirty) return toast('Bạn có thay đổi chưa gửi. Bấm Gửi trước, rồi mới báo trả.', true);
    modal('Báo đã trả thiết bị', '<p><b>' + esc(label) + '</b></p>' +
      '<label class="f">Tình trạng khi trả</label><div class="seg" id="rt"><button class="on">Bình thường</button><button>Hỏng</button><button>Thiếu</button></div>' +
      '<label class="f">Ghi chú (nếu hỏng/thiếu)</label><input type="text" id="rg">',
      '<button class="btn grow" data-x>Hủy</button><button class="btn pri grow" id="rok">Báo đã trả</button>',
      function (m, close) {
        var tt = 'Bình thường';
        m.querySelectorAll('#rt button').forEach(function (b) { b.onclick = function () { tt = b.textContent; m.querySelectorAll('#rt button').forEach(function (x) { x.classList.toggle('on', x === b); }); }; });
        m.querySelector('#rok').onclick = async function () {
          var note = m.querySelector('#rg').value.trim();
          if (tt !== 'Bình thường' && !note) return toast('Ghi rõ hỏng/thiếu gì vào ô ghi chú', true);
          var j = await call('gvReturn', { ids: ids, tinhTrang: tt, lyDo: note });
          if (!j) return;
          close(); toast('Đã báo trả ' + j.changed + ' thiết bị');
          await loadGV(S.gv.tuanBD); renderBao();
        };
      });
  }

  function switchWeek(t) {
    var go = async function () { await loadGV(t); renderBao(); };
    if (S.gv.dirty) confirmBox('Bạn có thay đổi chưa gửi. Chuyển tuần sẽ bỏ các thay đổi này?', 'Chuyển tuần', go, true); else go();
  }

  async function uploadLBG(file) {
    var grid;
    try { grid = await readExcel(file, 'LBG'); } catch (e) { return toast(e.message, true); }
    var p;
    try { p = U.parseLBG(grid); } catch (e) { return toast(e.message, true); }
    var teach = p.rows.filter(function (r) { return r.day; });
    if (!teach.length) return toast('Lịch báo giảng không có tiết dạy nào.', true);
    var apply = async function () {
      var old = S.gv;
      if (p.meta.tuanBD !== old.tuanBD) await loadGV(p.meta.tuanBD, { parsed: p });
      else {
        old.parsed = p; old.dirty = true;
        var manual = old.rows.filter(function (r) { return r.manual && !teach.some(function (t) { return t.key === r.key; }); });
        old.rows = teach.map(function (r) { return Object.assign({}, r); }).concat(manual.filter(function (r) { return old.sel[r.key]; }));
        sortRows(old.rows);
      }
      // gán điểm trường cho các tiết có lớp không rõ điểm
      var sites = (S.boot.me.diemTruong || '').split(',').filter(Boolean);
      S.gv.rows.forEach(function (r) { if (!r.site && sites.length === 1) r.site = sites[0]; });
      var ar = applyRules(S.gv.rows);
      await fetchHints();
      toast('Đã đọc ' + teach.length + ' tiết dạy – tuần ' + (p.meta.tuan || weekNo(p.meta.tuanBD)) + ruleMsg(ar));
      renderBao();
    };

  /** Lấy lịch báo giảng tuần trước (thứ, buổi, tiết, lớp, môn) làm khung để mượn trước */

      if (!src.length) src = (j.items || []).map(function (it) { return { ngay: it.ngay, buoi: it.buoi, tiet: Number(it.tiet), lop: it.lop, mon: it.mon, site: it.diemTruong }; });
      back = k;
    }
    if (!src.length) return toast('Chưa có lịch báo giảng tuần ' + (weekNo(g.tuanBD) - 1) + ' (và 3 tuần trước đó) trên app. Hãy thêm tiết thủ công.', true);
    var seen = {};

    var n = 0;
    src.forEach(function (r) {
      var x = { ngay: U.addDays(r.ngay, 7 * back), buoi: r.buoi, tiet: r.tiet, lop: r.lop, mon: r.mon, ppct: '', bai: '', site: r.site || U.siteOfClass(r.lop), manual: true };
      x.key = U.rowKey(x);

    var ar = applyRules(g.rows);
    await fetchHints();
    toast('Đã lấy ' + n + ' tiết từ lịch báo giảng tuần ' + (weekNo(g.tuanBD) - back) + '.' + ruleMsg(ar));

  }

  function monMatch(cmon, lmon) {
    var a = U.key(cmon), b = U.key(lmon);
    if (!a) return false;
    if (a.indexOf('dung chung') >= 0) return true;
    if (!b) return false;
    if (a.indexOf(b) >= 0 || b.indexOf(a) >= 0) return true;
    var syn = [['khoa hoc tu nhien', 'khtn', 'vat li', 'hoa hoc', 'sinh hoc'], ['lich su', 'dia li'], ['the chat', 'the duc'], ['cong dan', 'gdcd'], ['tin hoc', 'tin'], ['ngoai ngu', 'tieng anh'], ['am nhac', 'nghe thuat'], ['mi thuat', 'my thuat', 'nghe thuat'], ['trai nghiem', 'hdtn']];
    return syn.some(function (s) { var ia = s.some(function (x) { return a.indexOf(x) >= 0; }), ib = s.some(function (x) { return b.indexOf(x) >= 0; }); return ia && ib; });
  }
  function khoiMatch(ckhoi, lop) {
    var k = U.gradeOfClass(lop);
    if (!ckhoi || !k) return true;
    return new RegExp('(^|\\D)' + k + '(\\D|$)').test(ckhoi);
  }
  function availFor(c, r, exceptSelf) {
    var g = S.gv, used = g.usage[U.slotKey(c.id, r.ngay, r.buoi, r.tiet)] || 0;
    g.rows.forEach(function (x) {
      if (x.ngay !== r.ngay || x.buoi !== r.buoi || x.tiet !== r.tiet) return;
      (g.sel[x.key] || []).forEach(function (s) { if (s.catalogId === c.id && s.trangThai !== 'TU_CHOI' && s !== exceptSelf) used += s.soLuong; });
    });
    return c.soLuong - used;
  }

  /** Bộ lọc nhanh danh mục: theo tổ/kho và theo loại thiết bị */
  var LOAI_ORDER = ['Thiết bị', 'Dụng cụ', 'Tranh ảnh', 'Mô hình', 'Hóa chất', 'Phòng học bộ môn'];
  var TO_FILTERS = [['KHTN', 'Tổ KHTN', 'khtn'], ['KHXH', 'Tổ KHXH', 'khxh'], ['NK', 'Năng khiếu', 'nang khieu'], ['DC', 'Dùng chung', 'dung chung']];
  function catFilters(list, withMon) {
    var f = withMon ? [['mon', 'Cùng môn'], ['all', 'Tất cả']] : [['all', 'Tất cả']];
    TO_FILTERS.forEach(function (t) { if (list.some(function (c) { return catPass(c, t[0]); })) f.push([t[0], t[1]]); });
    var loais = {};
    list.forEach(function (c) { if (c.loai) loais[c.loai] = 1; });
    Object.keys(loais).sort(function (a, b) { var x = LOAI_ORDER.indexOf(a), y = LOAI_ORDER.indexOf(b); return (x < 0 ? 99 : x) - (y < 0 ? 99 : y); })
      .forEach(function (l) { f.push(['L:' + l, l]); });
    return f;
  }
  function catPass(c, f) {
    if (!f || f === 'all' || f === 'mon') return true;
    if (f.indexOf('L:') === 0) return c.loai === f.slice(2);
    var t = TO_FILTERS.filter(function (x) { return x[0] === f; })[0];
    if (!t) return true;
    var k = U.key(c.kho);
    if (f === 'DC') return k.indexOf('dung chung') >= 0 || U.key(c.mon).indexOf('dung chung') >= 0;
    return k.indexOf(t[2]) >= 0;
  }
  function chipsHtml(fl, cur) {
    return '<div class="fchips">' + fl.map(function (x) { return '<button class="fchip' + (x[0] === cur ? ' on' : '') + '" data-f="' + esc(x[0]) + '">' + esc(x[1]) + '</button>'; }).join('') + '</div>';
  }

  function openPicker(r) {
    var site = r.site || mySites()[0] || 'DC';

      '<input type="text" id="pq" class="grow" placeholder="🔍 Gõ tên thiết bị…" style="flex:1;width:auto"></div><div id="pf"></div><div id="pl" style="margin-top:2px"></div>',

          el.querySelectorAll('#pf [data-f]').forEach(function (b) { b.onclick = function () { flt = b.dataset.f; draw(); }; });

              (a <= 0 ? '<span class="chip r">Hết</span>' : '<span class="chip g">Còn ' + a + '/' + c.soLuong + '</span>') + '</div>';
          };

          if (!list.length) h = '<div class="empty">Kho ' + esc(siteName(site)) + ' chưa có danh mục thiết bị.<br>Nhờ nhân viên thiết bị tải danh mục lên.</div>';
          else if (flt === 'mon') {
            var sug = [], other = [];
            list.forEach(function (c) { if (!hit(c)) return; (monMatch(c.mon, r.mon) && khoiMatch(c.khoi, r.lop) ? sug : other).push(c); });
            var fav = kw ? [] : (S.boot.hayDung || []).map(function (x) { return resolveAt(x.ten, x.ma, site); }).filter(Boolean);
            var hint = kw ? [] : hintsFor(Object.assign({}, r, { site: site })).map(function (x) { return x.c; });
            if (hint.length) h += '<div class="sec">💡 Bài này thường dùng</div>' + hint.map(row).join('');
            if (fav.length) h += '<div class="sec">⭐ Thầy/cô hay dùng</div>' + fav.map(row).join('');

            h += sug.length ? sug.map(row).join('') : '<div class="mut sm" style="padding:8px 0">Không có thiết bị đúng môn. Gõ tên để tìm, hoặc bấm “Tất cả” / chọn tổ ở trên.</div>';
            if (kw) h += '<div class="sec">Thiết bị khác (' + other.length + ')</div>' + other.slice(0, 150).map(row).join('');

              (fl.length > 300 ? '<p class="mut sm">… gõ tên để tìm thêm</p>' : '');
          }
          h += '<div class="sec">Không có trong danh mục?</div>' +
            '<div class="item" id="pcus"><div class="grow"><div class="nm">✍️ ' + (q.value.trim() ? 'Mượn “' + esc(q.value.trim()) + '” (ghi tay)' : 'Gõ tay tên thiết bị khác') + '</div>' +
            '<div class="mut sm">Gửi cho NV thiết bị ' + esc(siteName(site)) + ' kiểm tra</div></div></div>';
          el.querySelector('#pl').innerHTML = h;

            var name = q.value.trim();
            if (!name) { q.focus(); return toast('Gõ tên thiết bị vào ô tìm kiếm phía trên, rồi bấm lại dòng ✍️'); }
            configItem(null, r, m.close, { ten: name, site: site });
          };
          el.querySelectorAll('.item[data-c]').forEach(function (it) {
            it.onclick = function () { if (!it.classList.contains('dis')) configItem(catById(it.dataset.c), r, m.close); };
          });

      });
  }

  /** Chuẩn hóa tên bài để so sánh: bỏ "(T1)", "Tiết 1", dấu câu, khoảng trắng */
  function normBai(b) {
    return U.key(b).replace(/\(\s*t\s*\d+\s*\)/g, ' ').replace(/tiet\s*\d+/g, ' ').replace(/[^a-z0-9]+/g, ' ').trim();
  }
  /** Các tiết cùng khối, cùng môn và cùng tên bài (hoặc cùng tiết PPCT ở lớp khác) trong cả tuần – sáng, chiều, mọi ngày */
  function sameLessons(r) {
    var g = S.gv, k = U.gradeOfClass(r.lop), nb = normBai(r.bai);
    return g.rows.filter(function (x) {
      if (x === r || U.gradeOfClass(x.lop) !== k || U.key(x.mon) !== U.key(r.mon)) return false;
      if (nb && normBai(x.bai) === nb) return true;
      return x.lop !== r.lop && r.ppct && String(x.ppct) === String(r.ppct);
    });
  }

  function addSel(r, c, sl, ht, site) {
    var g = S.gv, list = g.sel[r.key] = g.sel[r.key] || [];
    var id = c ? c.id : '', ten = c ? c.ten : site.ten;
    var ex = list.filter(function (x) { return (x.catalogId || '') === id && (id || U.key(x.tenTB) === U.key(ten)) && (!x.trangThai || x.trangThai === 'CHO_GIAO'); })[0];
    if (ex) ex.soLuong += sl; else list.push({ catalogId: id, soLuong: sl, hinhThuc: ht, tenTB: ten, site: c ? c.diemTruong : site.site });
  }

  /** Tìm thiết bị (theo mã hoặc tên) trong kho của một điểm trường */
  function resolveAt(ten, ma, site) {
    var list = S.boot.catalog.filter(function (x) { return x.diemTruong === site; });
    return (ma && list.filter(function (x) { return x.ma === ma; })[0]) || list.filter(function (x) { return U.key(x.ten) === U.key(ten); })[0] || null;
  }
  function rowSite(r) { return r.site || mySites()[0] || 'DC'; }

  /* ----- Gợi ý theo bài ----- */
  function hintKeys(r) {
    var base = U.key(r.mon) + '|' + U.gradeOfClass(r.lop) + '|', ks = [];
    if (r.ppct) ks.push(base + 'p' + String(r.ppct).trim());
    var nb = normBai(r.bai); if (nb) ks.push(base + 'b' + nb);
    return ks;
  }
  async function fetchHints() {
    var g = S.gv; if (!g) return;
    var keys = {};
    g.rows.forEach(function (r) { hintKeys(r).forEach(function (k) { keys[k] = 1; }); });
    var list = Object.keys(keys);
    g.hints = {};
    if (!list.length) return;
    try { var j = await api('hints', { keys: list }, true); if (j.ok) g.hints = j.hints || {}; } catch (e) { }
  }
  function hintsFor(r) {
    var g = S.gv, seen = {}, out = [], site = rowSite(r);
    hintKeys(r).forEach(function (k) {
      ((g.hints || {})[k] || []).forEach(function (h) {
        var c = resolveAt(h.ten, h.ma, site);
        if (!c || seen[c.id]) return;
        seen[c.id] = 1; out.push({ c: c, soLuong: h.soLuong, n: h.n });
      });
    });
    return out.slice(0, 5);
  }

  /* ----- Mượn cố định ----- */
  function ruleMatch(rule, r) {
    return U.key(rule.mon) === U.key(r.mon) && (!rule.khoi || String(rule.khoi) === U.gradeOfClass(r.lop));
  }
  /** Tự điền thiết bị theo các quy tắc mượn cố định; bỏ qua tiết đã có thiết bị đó */
  function applyRules(rows) {
    var rules = S.boot.rules || [], g = S.gv, res = { added: 0, miss: [] };
    if (!rules.length) return res;
    rows.forEach(function (r) {
      rules.forEach(function (rule) {
        if (!ruleMatch(rule, r)) return;
        var c = resolveAt(rule.tenTB, rule.maTB, rowSite(r));
        if (!c) { res.miss.push(rule.tenTB + ' (kho ' + siteName(rowSite(r)) + ' không có)'); return; }
        var list = g.sel[r.key] || [];
        if (list.some(function (x) { return x.catalogId === c.id; })) return;
        var a = availFor(c, r);
        if (a < 1) { res.miss.push(c.ten + ' – ' + r.lop + ' ' + U.dm(r.ngay) + ' tiết ' + r.tiet + ' (hết)'); return; }
        addSel(r, c, Math.min(rule.soLuong || 1, a), rule.hinhThuc || 'Tại lớp', null);
        res.added++;
      });
    });
    if (res.added) g.dirty = true;
    return res;
  }
  function ruleMsg(ar) {
    if (!ar.added && !ar.miss.length) return '';
    var uniq = ar.miss.filter(function (x, i) { return ar.miss.indexOf(x) === i; });
    return (ar.added ? '\nĐã tự điền ' + ar.added + ' thiết bị theo mượn cố định.' : '') + (uniq.length ? '\nKhông điền được: ' + uniq.slice(0, 4).join('; ') : '');
  }
  function ruleLabel(x) { return esc(x.mon) + (x.khoi ? ' khối ' + esc(x.khoi) : ' (mọi khối)') + ' → <b>' + esc(x.tenTB) + '</b> ×' + x.soLuong; }
  function rulesModal() {
    var rules = S.boot.rules || [];
    modal('📌 Mượn cố định',
      '<p class="mut sm" style="margin-top:0">Thiết bị dùng thường xuyên cho một môn (ví dụ Tin học → Phòng thực hành Tin học; Toán → thước, compa, ê ke). ' +
      'Mỗi khi tải lịch báo giảng hoặc lấy lịch tuần trước, app tự điền sẵn cho các tiết của môn đó.</p>' +
      (rules.length ? rules.map(function (x) { return '<div class="item" style="cursor:default"><div class="grow">' + ruleLabel(x) + '</div><button class="btn sm warn" data-del="' + esc(x.id) + '">Xóa</button></div>'; }).join('')
        : '<div class="empty">Chưa có. Để thêm: bấm “+ Thiết bị” ở một tiết, chọn thiết bị, rồi tích ô <b>📌 Mượn cố định</b>.</div>'),
      (rules.length && S.gv && S.gv.rows.length ? '<button class="btn pri grow" id="rapply">Áp dụng cho tuần ' + weekNo(S.gv.tuanBD) + '</button>' : '') + '<button class="btn grow" data-x>Đóng</button>',
      function (m, close) {
        m.querySelectorAll('[data-del]').forEach(function (b) {
          b.onclick = async function () {
            var j = await call('deleteRule', { id: b.dataset.del });
            if (j) { S.boot.rules = j.rules; close(); rulesModal(); renderBao(); }
          };
        });
        var ap = m.querySelector('#rapply');
        if (ap) ap.onclick = function () { var ar = applyRules(S.gv.rows); close(); renderBao(); toast(ar.added || ar.miss.length ? ruleMsg(ar).trim() : 'Các tiết đã có đủ thiết bị mượn cố định.'); };
      });
  }

  /** Thiết bị tương ứng ở kho của điểm trường khác (cùng mã hoặc cùng tên) */
  function twinAt(c, site) {
    if (!c || c.diemTruong === site) return c;
    var t = S.boot.catalog.filter(function (x) { return x.diemTruong === site && c.ma && x.ma === c.ma; })[0];
    return t || S.boot.catalog.filter(function (x) { return x.diemTruong === site && U.key(x.ten) === U.key(c.ten); })[0] || null;
  }

  /** c: thiết bị trong danh mục, hoặc null kèm custom = {ten, site} khi ghi tay */
  function configItem(c, r, closePicker, custom) {
    var max = c ? availFor(c, r) : 99, sl = 1;
    var ht = c && c.loai === 'Phòng học bộ môn' ? 'Phòng thực hành' : 'Tại lớp';
    var baseSite = c ? c.diemTruong : custom.site;
    var same = sameLessons(r).map(function (x) {
      var site = x.site || baseSite;
      var cx = c ? twinAt(c, site) : null;
      var a = c ? (cx ? availFor(cx, x) : 0) : 99;
      return { row: x, site: site, c: cx, avail: a, missing: !!c && !cx };
    });
    var tenHien = c ? c.ten : custom.ten;
    var sameHtml = same.length ? '<label class="f">Thêm luôn cho các tiết cùng bài (cùng khối, cùng môn)</label><div class="checks" style="display:flex;flex-direction:column;gap:2px">' +
      same.map(function (o, i) {
        var x = o.row, other = o.site !== baseSite;
        return '<label style="margin:2px 0"><input type="checkbox" data-same="' + i + '"' + (o.avail > 0 ? ' checked' : ' disabled') + '> <b>' + esc(x.lop) + '</b> · ' + U.thu(x.ngay) + ' ' + U.dm(x.ngay) + ' · ' + x.buoi + ' tiết ' + x.tiet +
          (other ? ' <span class="chip b">kho ' + esc(siteName(o.site)) + '</span>' : '') +
          (o.missing ? ' <span class="chip r">Kho ' + esc(siteName(o.site)) + ' không có</span>' : c ? (o.avail > 0 ? ' <span class="mut sm">(còn ' + o.avail + ')</span>' : ' <span class="chip r">Hết</span>') : '') + '</label>';
      }).join('') + '</div>' : '';
    modal(esc(tenHien),
      '<div class="mut sm">' + (c ? esc([c.ma, c.loai, c.kho, siteName(c.diemTruong)].filter(Boolean).join(' · ')) : '✍️ Ghi tay – không có trong danh mục, nhân viên thiết bị sẽ tự kiểm tra') + '</div>' +
      '<label class="f">Số lượng' + (c ? ' (còn ' + max + ' ' + esc(c.donVi || '') + ')' : '') + '</label>' +
      '<div class="stepper"><button id="sm">−</button><input type="number" id="sv" value="1" min="1" max="' + max + '"><button id="sp">+</button></div>' +
      '<label class="f">Hình thức sử dụng</label><div class="seg"><button data-h="Tại lớp">Tại lớp</button><button data-h="Phòng thực hành">Phòng thực hành</button></div>' + sameHtml +
      (c && has('GV') ? '<label class="f">📌 Mượn cố định</label><div class="checks" style="display:flex;flex-direction:column;gap:2px">' +
        '<label><input type="checkbox" id="pin"> Luôn tự điền thiết bị này cho mọi tiết <b>' + esc(r.mon) + '</b></label>' +
        '<label style="margin-left:22px"><input type="radio" name="pk" value="" checked> mọi khối</label>' +
        '<label style="margin-left:22px"><input type="radio" name="pk" value="' + esc(U.gradeOfClass(r.lop)) + '"> chỉ khối ' + esc(U.gradeOfClass(r.lop)) + '</label></div>' : ''),
      '<button class="btn grow" data-x>Hủy</button><button class="btn pri grow" id="cok">Thêm vào tiết</button>',
      function (m, close) {
        var sv = m.querySelector('#sv');
        var setH = function () { m.querySelectorAll('[data-h]').forEach(function (b) { b.classList.toggle('on', b.dataset.h === ht); }); };
        setH();
        m.querySelectorAll('[data-h]').forEach(function (b) { b.onclick = function () { ht = b.dataset.h; setH(); }; });
        m.querySelector('#sm').onclick = function () { sv.value = Math.max(1, (+sv.value || 1) - 1); };
        m.querySelector('#sp').onclick = function () { sv.value = Math.min(max, (+sv.value || 0) + 1); };
        m.querySelector('#cok').onclick = async function () {
          sl = Math.floor(+sv.value || 1);
          if (sl < 1 || sl > max) return toast('Số lượng phải từ 1 đến ' + max, true);
          var done = 1, skipped = [];
          addSel(r, c, sl, ht, custom ? { ten: custom.ten, site: custom.site } : null);
          m.querySelectorAll('[data-same]:checked').forEach(function (cb) {
            var o = same[+cb.dataset.same];
            if (c) {
              var n = Math.min(sl, o.c ? availFor(o.c, o.row) : 0);
              if (n < 1) { skipped.push(o.row.lop); return; }
              addSel(o.row, o.c, n, ht, null);
            } else addSel(o.row, null, sl, ht, { ten: custom.ten, site: o.site });
            done++;
          });
          var pin = m.querySelector('#pin');
          var msg = 'Đã thêm cho ' + done + ' tiết' + (skipped.length ? '. Hết thiết bị ở: ' + skipped.join(', ') : '');
          S.gv.dirty = true; close(); closePicker();
          if (pin && pin.checked) {
            var kh = (m.querySelector('[name=pk]:checked') || {}).value || '';
            var j = await call('saveRule', { rule: { mon: r.mon, khoi: kh, tenTB: c.ten, maTB: c.ma, soLuong: sl, hinhThuc: ht } });
            if (j) { S.boot.rules = j.rules; var ar = applyRules(S.gv.rows); msg += '\n📌 Đã lưu mượn cố định' + (ar.added ? ', tự điền thêm ' + ar.added + ' tiết trong tuần.' : '.'); }
          }
          renderBao(); toast(msg);
        };
      });
  }

  function collectItems() {
    var g = S.gv, out = [];
    g.rows.forEach(function (r) {
      (g.sel[r.key] || []).forEach(function (x) {
        if (x.trangThai === 'TU_CHOI') return;
        out.push({ catalogId: x.catalogId || '', site: x.site || r.site, tenTB: x.tenTB, soLuong: x.soLuong, hinhThuc: x.hinhThuc, ngay: r.ngay, buoi: r.buoi, tiet: r.tiet,
          lop: r.lop, mon: r.mon, tietPPCT: r.ppct, tenBai: r.bai });
      });
    });
    return out;
  }

  async function sendWeek() {
    var g = S.gv, items = collectItems();
    if (!items.length) return toast('Chưa chọn thiết bị nào. Nếu tuần này không mượn, bấm "Tuần này không mượn".', true);
    var j = await call('submitWeek', { tuanBD: g.tuanBD, soTuan: (g.parsed && g.parsed.meta.tuan) || weekNo(g.tuanBD), items: items, lbg: g.parsed ? g.parsed.grid : null });
    if (!j) return;
    toast(j.message);
    await loadGV(g.tuanBD);
    renderBao();
  }

  function noBorrow() {
    var g = S.gv;
    var n = collectItems().length;
    confirmBox('Báo tuần ' + weekNo(g.tuanBD) + ' (' + U.dm(g.tuanBD) + ' – ' + U.dm(U.addDays(g.tuanBD, 6)) + ') KHÔNG MƯỢN thiết bị?' +
      (n ? '\n\nCác thiết bị đã chọn của tuần này sẽ bị bỏ.' : ''), 'Gửi: không mượn', async function () {
        var j = await call('noBorrow', { tuanBD: g.tuanBD, soTuan: weekNo(g.tuanBD), lbg: g.parsed ? g.parsed.grid : null });
        if (!j) return;
        toast(j.message);
        await loadGV(g.tuanBD);
        renderBao();
      });
  }

  function dlLBG() {
    var g = S.gv, byRow = {};
    g.rows.forEach(function (r) {
      if (r.r === undefined) return;
      var list = (g.sel[r.key] || []).filter(function (x) { return x.trangThai !== 'TU_CHOI'; });
      if (list.length) byRow[r.r] = list;
    });
    exportWith(function () { return EX.buildLBG(g.parsed, byRow); },
      'LBG_' + U.noAccent(S.boot.me.hoTen).replace(/\s+/g, '_') + '_tuan' + weekNo(g.tuanBD) + '_co_thiet_bi.xlsx');
  }

  function dlPhieuGV() {
    var g = S.gv, me = S.boot.me, bySite = {};
    g.rows.forEach(function (r) {
      (g.sel[r.key] || []).forEach(function (x) {
        if (x.trangThai === 'TU_CHOI') return;
        var s = x.site || r.site || 'DC';
        (bySite[s] = bySite[s] || []).push({ ngay: r.ngay, buoi: r.buoi, tiet: r.tiet, tietPPCT: r.ppct, mon: r.mon, lop: r.lop, tenBai: r.bai,
          tenTB: x.tenTB, soLuong: x.soLuong, hinhThuc: x.hinhThuc, trangThai: x.trangThai });
      });
    });
    var sites = Object.keys(bySite);
    if (!sites.length) sites = (me.diemTruong || 'DC').split(',').filter(Boolean);
    var groups = sites.map(function (s) {
      return { hoTen: me.hoTen, to: me.to, soTuan: weekNo(g.tuanBD), tuanBD: g.tuanBD, site: s, items: bySite[s] || [] };
    });
    exportWith(function () { return EX.buildPhieu(S.boot.settings, groups); },
      'Tuan_' + weekNo(g.tuanBD) + '_Phieu_muon_TBDH_' + U.noAccent(me.hoTen).replace(/\s+/g, '_') + '.xlsx');
  }

  /* =================== GIÁO VIÊN: ĐÃ BÁO =================== */
  async function viewLS(v) {
    var j = await call('myWeeks', {});
    if (!j) return;
    if (!j.weeks.length) { v.innerHTML = '<div class="card empty">Bạn chưa báo mượn tuần nào.</div>'; return; }
    v.innerHTML = '<div class="card"><h2>Các tuần đã báo</h2>' + j.weeks.map(function (w) {
      return '<div class="item" data-w="' + w.tuanBD + '"><div class="grow"><div class="nm">Tuần ' + esc(w.soTuan || weekNo(w.tuanBD)) + ' <span class="mut sm">(' + U.dm(w.tuanBD) + ' – ' + U.dm(U.addDays(w.tuanBD, 6)) + ')</span></div>' +
        '<div class="mut sm">Gửi lúc ' + esc(w.guiLuc) + '</div></div>' +

          '<span class="chip g">' + w.soThietBi + ' thiết bị</span>' + (w.tuChoi ? ' <span class="chip r">' + w.tuChoi + ' từ chối</span>' : '')) + '</div>';
    }).join('') + '</div>';
    v.querySelectorAll('[data-w]').forEach(function (it) {

  /* =================== NV THIẾT BỊ: GIAO – TRẢ =================== */
  function nvSite() {
    var s = mySites();
    if (!S.nv.site || s.indexOf(S.nv.site) < 0) S.nv.site = s[0] || 'DC';
    return S.nv.site;
  }

  async function viewHN(v) {
    var site = nvSite();
    S.nv.ngay = S.nv.ngay || S.boot.today;
    var j = await call('siteDay', { site: site, ngay: S.nv.ngay });
    if (!j) return;
    var sites = mySites();
    var h = '<div class="card"><div class="row">' +
      (sites.length > 1 ? '<select id="hs" class="grow" style="width:auto">' + siteOpts(sites, site) + '</select>' : '<b class="grow">' + esc(siteName(site)) + '</b>') +
      '<button class="btn sm" id="ht">Hôm nay</button></div>' +
      '<div class="row" style="margin-top:8px;flex-wrap:nowrap"><button class="btn sm" id="hp">◀</button><input type="date" id="hd" value="' + S.nv.ngay + '" style="flex:1;min-width:0"><button class="btn sm" id="hx">▶</button></div>' +
      '<div class="mut sm" style="margin-top:6px;text-align:center">' + U.thu(S.nv.ngay) + ', ' + U.dmy(S.nv.ngay) + '</div></div>';
    if (j.chuaTra.length) {
      h += '<div class="alert"><b>⚠ ' + j.chuaTra.length + ' thiết bị đã giao từ hôm trước nhưng chưa ghi nhận trả:</b>' +
        j.chuaTra.map(function (it) { return '\n• ' + it.hoTen + ' – ' + it.tenTB + ' ×' + it.soLuong + ' (' + U.dm(it.ngay) + ', ' + it.buoi + ' tiết ' + it.tiet + ')'; }).join('') +
        '\n<button class="btn sm" id="tra-cu" style="margin-top:6px">Ghi nhận đã trả tất cả</button></div>';
    }
    if (!j.items.length) h += '<div class="card empty">Không có giáo viên nào mượn thiết bị ngày này.</div>';
    ['Sáng', 'Chiều'].forEach(function (b) {
      var list = j.items.filter(function (it) { return it.buoi === b; });
      if (!list.length) return;
      h += '<div class="day">Buổi ' + b.toLowerCase() + '</div>';
      var by = {};
      list.forEach(function (it) { (by[it.username] = by[it.username] || []).push(it); });
      Object.keys(by).sort(function (a, c) { return Math.min.apply(null, by[a].map(function (x) { return +x.tiet; })) - Math.min.apply(null, by[c].map(function (x) { return +x.tiet; })); })
        .forEach(function (u) {
          var its = by[u].sort(function (a, c) { return a.tiet - c.tiet; });
          var cho = its.filter(function (x) { return x.trangThai === 'CHO_GIAO'; }), dg = its.filter(function (x) { return x.trangThai === 'DA_GIAO'; });
          h += '<div class="gvcard"><div class="gh"><b class="grow">' + esc(its[0].hoTen) + ' <span class="mut sm">· Tổ ' + esc(its[0].to) + '</span></b>' +
            (cho.length ? '<button class="btn sm pri" data-ga="' + cho.map(function (x) { return x.id; }).join(',') + '">Giao (' + cho.length + ')</button>' : '') +
            (dg.length ? '<button class="btn sm" data-ta="' + dg.map(function (x) { return x.id; }).join(',') + '">Nhận trả (' + dg.length + ')</button>' : '') +
            '</div><div class="gl">' + its.map(function (it) {
              return '<div class="li" data-it="' + it.id + '"><span class="grow"><b>T' + it.tiet + '</b> · ' + esc(it.lop) + ' · ' + esc(it.tenTB) + (it.catalogId ? '' : ' ✍️') + ' <b>×' + it.soLuong + '</b>' +
                '<br><span class="mut sm">' + esc(it.gioDuKien) + ' · ' + esc(it.hinhThuc) + ' · ' + esc(it.mon) +
                (it.gioGiao ? ' · giao ' + esc(it.gioGiao.slice(-5)) : '') + (it.gioTra ? ' · trả ' + esc(it.gioTra.slice(-5)) : '') +
                (!okTT(it.tinhTrang) ? ' · <b style="color:#c0392b">' + esc(it.tinhTrang) + '</b>' : (it.tinhTrang && it.tinhTrang !== 'Bình thường' ? ' · ' + esc(it.tinhTrang) : '')) + '</span></span>' + chipStatus(it.trangThai) + '</div>';
            }).join('') + '</div></div>';
        });
    });
    v.innerHTML = h;
    var all = j.items.concat(j.chuaTra);
    var re = function () { viewHN(document.getElementById('v')); };
    var hs = v.querySelector('#hs'); if (hs) hs.onchange = function () { S.nv.site = hs.value; re(); };
    v.querySelector('#hd').onchange = function () { if (this.value) { S.nv.ngay = this.value; re(); } };
    v.querySelector('#hp').onclick = function () { S.nv.ngay = U.addDays(S.nv.ngay, -1); re(); };
    v.querySelector('#hx').onclick = function () { S.nv.ngay = U.addDays(S.nv.ngay, 1); re(); };
    v.querySelector('#ht').onclick = function () { S.nv.ngay = S.boot.today; re(); };
    var tc = v.querySelector('#tra-cu');
    if (tc) tc.onclick = function () { setOp(j.chuaTra.map(function (x) { return x.id; }), 'TRA', 'Bình thường', '', re); };
    v.querySelectorAll('[data-ga]').forEach(function (b) { b.onclick = function () { setOp(b.dataset.ga.split(','), 'GIAO', '', '', re); }; });
    v.querySelectorAll('[data-ta]').forEach(function (b) { b.onclick = function () { setOp(b.dataset.ta.split(','), 'TRA', 'Bình thường', '', re); }; });
    v.querySelectorAll('[data-it]').forEach(function (el) {
      el.onclick = function () { itemMenu(all.filter(function (x) { return x.id === el.dataset.it; })[0], re); };
    });
  }

  async function setOp(ids, op, tinhTrang, lyDo, after) {
    var j = await call('setItems', { ids: ids, op: op, tinhTrang: tinhTrang, lyDo: lyDo });
    if (j) { toast({ GIAO: 'Đã ghi nhận giao', TRA: 'Đã ghi nhận trả', TU_CHOI: 'Đã từ chối', HOAN_TAC: 'Đã hoàn tác' }[op] + ' (' + j.changed + ')'); after(); }
  }

      ' · ' + U.dm(it.ngay) + ' ' + esc(it.buoi) + ' tiết ' + esc(it.tiet) + '<br>' + esc(it.tenBai) + '</span></p>' +
      (it.gioGiao ? '<p class="sm">Giao: ' + esc(it.gioGiao) + ' (' + esc(it.nguoiGiao) + ')' + (it.gioTra ? '<br>Trả: ' + esc(it.gioTra) + ' – ' + esc(it.tinhTrang) : '') + '</p>' : '') +

      bind('#o-g', 'GIAO'); bind('#o-t', 'TRA'); bind('#o-tc', 'TU_CHOI'); bind('#o-h', 'HOAN_TAC');

      '<div class="card">' + (show.length ? show.map(function (x) {

        return '<div class="item" style="cursor:default"><div class="grow"><div class="nm">' + esc(x.hoTen) + '</div><div class="mut sm">Tổ ' + esc(x.to || '—') + (x.guiLuc ? ' · ' + esc(x.guiLuc) : '') + '</div></div>' + c + '</div>';

    v.innerHTML = h;
    var re = function () { viewTuan(document.getElementById('v')); };

  function mapCatalogGrid(grid) {
    var hdr = -1, H;
    for (var i = 0; i < Math.min(grid.length, 30); i++) {
      var ks = grid[i].map(U.key);
      if (ks.some(function (k) { return k.indexOf('ten') === 0 && (k.indexOf('thiet bi') >= 0 || k.indexOf('do dung') >= 0 || k === 'ten'); })) { hdr = i; H = ks; break; }
    }
    if (hdr < 0) throw new Error('Không tìm thấy cột "Tên thiết bị" trong file.');
    var col = function (tests, not) {
      for (var j = 0; j < H.length; j++) {
        var k = H[j];
        if (not && not.some(function (n) { return k.indexOf(n) >= 0; })) continue;
        if (tests.some(function (t) { return k.indexOf(t) >= 0; })) return j;
      }
      return -1;
    };
    var C = {
      ma: col(['ma thiet bi', 'ma tb', 'ma do dung', 'ma so']) >= 0 ? col(['ma thiet bi', 'ma tb', 'ma do dung', 'ma so']) : col(['ma'], ['mau', 'mang']),
      ten: col(['ten thiet bi', 'ten do dung', 'ten tb']) >= 0 ? col(['ten thiet bi', 'ten do dung', 'ten tb']) : col(['ten']),
      loai: col(['loai']), mon: col(['mon']), khoi: col(['khoi', 'lop su dung'], ['kho/', 'kho ']), kho: col(['kho', 'phong', 'vi tri'], ['khoi']),
      soLuong: col(['so luong hien co', 'so luong con', 'hien co', 'con lai']) >= 0 ? col(['so luong hien co', 'so luong con', 'hien co', 'con lai']) : col(['so luong', 'sl']),
      donVi: col(['don vi', 'dvt']), ghiChu: col(['ghi chu'])
    };
    var rows = [];
    for (var r = hdr + 1; r < grid.length; r++) {
      var g = grid[r], ten = C.ten >= 0 ? String(g[C.ten] || '').trim() : '';
      if (!ten) continue;
      var o = { ten: ten };
      ['ma', 'loai', 'mon', 'khoi', 'kho', 'donVi', 'ghiChu'].forEach(function (k) { o[k] = C[k] >= 0 ? String(g[C[k]] || '').trim() : ''; });
      o.soLuong = C.soLuong >= 0 ? (parseInt(String(g[C.soLuong]).replace(/[^\d]/g, ''), 10) || 0) : 1;
      rows.push(o);
    }
    return { rows: rows, cols: C };
  }

      }).join('') + '</div>';
    var P = [['GIO_SANG', 'Giờ vào tiết 1 buổi sáng', 'time'], ['GIO_CHIEU', 'Giờ vào tiết 1 buổi chiều', 'time'], ['PHUT_TIET', 'Số phút mỗi tiết', 'number'],
      ['PHUT_NGHI', 'Nghỉ giữa các tiết (phút)', 'number'], ['RA_CHOI_SAU_TIET', 'Ra chơi sau tiết', 'number'], ['PHUT_RA_CHOI', 'Thời gian ra chơi (phút)', 'number'],
      ['GIO_TU_TRA', 'Giờ app tự ghi trả thiết bị chưa trả trong ngày', 'time'], ['NGAY_TUAN1', 'Ngày bắt đầu Tuần 1 (thứ Hai)', 'date'], ['TEN_TRUONG', 'Tên trường (in trên phiếu)', 'text'], ['CAP_TREN', 'Cơ quan cấp trên (in trên phiếu)', 'text']];
    h += '<div class="card"><h2>Cài đặt</h2>' + P.map(function (p) { return '<label class="f">' + p[1] + '</label><input type="' + p[2] + '" id="s_' + p[0] + '" value="' + esc(st[p[0]]) + '">'; }).join('') +
      '<div class="note" id="gp"></div><button class="btn pri" id="ssave">Lưu cài đặt</button></div>';
    v.innerHTML = h;
    var re = function () { viewQT(document.getElementById('v')); };
    var uq = v.querySelector('#uq');
    uq.oninput = function () { S.admin.q = uq.value; clearTimeout(S.admin.t); S.admin.t = setTimeout(function () { re(); setTimeout(function () { var e = document.getElementById('uq'); if (e) { e.focus(); e.setSelectionRange(e.value.length, e.value.length); } }, 50); }, 400); };
    v.querySelector('#ua').onclick = function () { editUser({ vaiTro: 'GV', diemTruong: '' }, re); };
    v.querySelector('#um').onclick = function () { exportWith(EX.buildMauGV, 'Mau_danh_sach_tai_khoan.xlsx'); };
    v.querySelector('#ui').onclick = function () { pickFile('.xls,.xlsx', function (f) { importUsersFile(f, re); }); };
    v.querySelectorAll('[data-u]').forEach(function (el) { el.onclick = function () { editUser(j.users.filter(function (u) { return u.username === el.dataset.u; })[0], re); }; });
    var preview = function () {
      var s = {}; P.forEach(function (p) { s[p[0]] = v.querySelector('#s_' + p[0]).value; });
      var f = function (b) {
        var st0 = (b === 'S' ? s.GIO_SANG : s.GIO_CHIEU).split(':'), m = +st0[0] * 60 + (+st0[1] || 0), out = [];
        for (var t = 1; t <= 5; t++) { out.push('T' + t + ' ' + U.pad(Math.floor(m / 60)) + ':' + U.pad(m % 60)); m += (+s.PHUT_TIET) + (t === +s.RA_CHOI_SAU_TIET ? +s.PHUT_RA_CHOI : +s.PHUT_NGHI); }
        return out.join(' · ');
      };
      v.querySelector('#gp').innerHTML = '<b>Giờ vào các tiết</b><br>Sáng: ' + f('S') + '<br>Chiều: ' + f('C');
      return s;
    };
    P.forEach(function (p) { v.querySelector('#s_' + p[0]).oninput = preview; });
    preview();
    v.querySelector('#ssave').onclick = async function () {
      var s = preview();
      if (U.parseYmd(s.NGAY_TUAN1).getDay() !== 1) return toast('Ngày bắt đầu Tuần 1 phải là thứ Hai', true);
      var r = await call('saveSettings', { settings: s });
      if (r) { S.boot.settings = r.settings; toast('Đã lưu cài đặt'); }
    };
  }

  function editUser(u, after) {
    var isNew = !u.username;
    var sites = (u.diemTruong || '').split(','), roles = (u.vaiTro || '').split(',');
    modal(isNew ? 'Thêm tài khoản' : esc(u.hoTen),
      '<label class="f">Họ và tên</label><input type="text" id="uh" value="' + esc(u.hoTen || '') + '">' +
      (isNew ? '' : '<p class="mut sm">Tên đăng nhập: <b>' + esc(u.username) + '</b></p>') +
      '<label class="f">Tổ</label><select id="ut"><option value="">—</option>' + S.boot.toList.map(function (x) { return '<option' + (x === u.to ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('') + '</select>' +
      '<label class="f">Điểm trường (dạy / phụ trách)</label><div class="checks">' + ['DC', 'PH1', 'PH2'].map(function (k) {
        return '<label><input type="checkbox" name="us" value="' + k + '"' + (sites.indexOf(k) >= 0 ? ' checked' : '') + '>' + esc(siteName(k)) + '</label>';
      }).join('') + '</div>' +
      '<label class="f">Vai trò</label><div class="checks">' + [['GV', 'Giáo viên'], ['NVTB', 'NV thiết bị'], ['ADMIN', 'Quản trị']].map(function (r) {
        return '<label><input type="checkbox" name="ur" value="' + r[0] + '"' + (roles.indexOf(r[0]) >= 0 ? ' checked' : '') + '>' + r[1] + '</label>';
      }).join('') + '</div>' +
      (!isNew ? '<div class="row" style="margin-top:14px"><button class="btn sm" id="urp">Đặt lại mật khẩu</button>' + (u.khoa ? '<button class="btn sm" id="uul">Mở khóa</button>' : '') + '<button class="btn sm warn" id="udel">Xóa tài khoản</button></div>' : ''),
      '<button class="btn grow" data-x>Hủy</button><button class="btn pri grow" id="usv">Lưu</button>',
      function (m, close) {
        var vals = function (n) { return Array.prototype.map.call(m.querySelectorAll('[name=' + n + ']:checked'), function (x) { return x.value; }).join(','); };
        m.querySelector('#usv').onclick = async function () {
          var o = { username: u.username, hoTen: m.querySelector('#uh').value.trim(), to: m.querySelector('#ut').value, diemTruong: vals('us'), vaiTro: vals('ur') };
          if (!o.hoTen) return toast('Nhập họ tên', true);
          if (!o.vaiTro) return toast('Chọn ít nhất một vai trò', true);
          var j = await call('saveUser', { user: o });
          if (!j) return;
          close();
          if (j.created) modal('Đã tạo tài khoản', '<p>' + esc(j.created.hoTen) + '</p><p>Tên đăng nhập: <b>' + esc(j.created.username) + '</b><br>Mật khẩu: <b>123456</b></p>', '<button class="btn pri grow" data-x>Xong</button>');
          else toast('Đã lưu');
          after();
        };
        var b;
        if ((b = m.querySelector('#urp'))) b.onclick = async function () { var j = await call('resetPass', { username: u.username }); if (j) toast(j.message); };
        if ((b = m.querySelector('#uul'))) b.onclick = async function () { var j = await call('saveUser', { user: { username: u.username, moKhoa: true } }); if (j) { toast('Đã mở khóa'); close(); after(); } };
        if ((b = m.querySelector('#udel'))) b.onclick = function () {
          confirmBox('Xóa tài khoản ' + u.hoTen + '? Lịch sử mượn vẫn được giữ.', 'Xóa', async function () {
            var j = await call('saveUser', { user: { username: u.username, xoa: true } }); if (j) { toast('Đã xóa'); close(); after(); }
          }, true);
        };
      });
  }

  async function importUsersFile(file, after) {
    var grid;
    try { grid = await readExcel(file); } catch (e) { return toast(e.message, true); }
    var hdr = -1, H;
    for (var i = 0; i < Math.min(30, grid.length); i++) { var ks = grid[i].map(U.key); if (ks.some(function (k) { return k.indexOf('ho va ten') >= 0 || k === 'ho ten' || k.indexOf('ho ten') === 0; })) { hdr = i; H = ks; break; } }
    if (hdr < 0) return toast('Không thấy cột "Họ và tên" trong file.', true);
    var c = function (t) { for (var j = 0; j < H.length; j++) if (t(H[j])) return j; return -1; };
    var cH = c(function (k) { return k.indexOf('ho') === 0 && k.indexOf('ten') >= 0; }), cT = c(function (k) { return k === 'to' || k.indexOf('to chuyen mon') >= 0 || k === 'to cm'; }),
      cD = c(function (k) { return k.indexOf('diem truong') >= 0 || k.indexOf('phan hieu') >= 0 || k.indexOf('noi day') >= 0; }), cV = c(function (k) { return k.indexOf('vai tro') >= 0 || k.indexOf('chuc vu') >= 0; });
    var rows = [];
    for (var r = hdr + 1; r < grid.length; r++) {
      var name = String(grid[r][cH] || '').trim();
      if (!name || /^\d+$/.test(name)) continue;
      rows.push({ hoTen: name, to: cT >= 0 ? grid[r][cT] : '', diemTruong: cD >= 0 ? grid[r][cD] : '', vaiTro: cV >= 0 ? grid[r][cV] : 'GV' });
    }
    if (!rows.length) return toast('Không có dòng nào.', true);
    confirmBox('Đọc được ' + rows.length + ' người. Người đã có (trùng họ tên) sẽ được cập nhật tổ/điểm trường/vai trò; người mới được tạo tài khoản với mật khẩu 123456.', 'Tải lên', async function () {
      var j = await call('importUsers', { rows: rows });
      if (!j) return;
      after();
      var txt = j.added.map(function (a) { return a.hoTen + ': ' + a.username; }).join('\n');
      modal('Kết quả', '<p>Thêm mới <b>' + j.added.length + '</b>, cập nhật <b>' + j.updated + '</b>.</p>' +
        (j.added.length ? '<div class="tw"><table class="t"><tr><th>Họ tên</th><th>Tên đăng nhập</th></tr>' + j.added.map(function (a) { return '<tr><td>' + esc(a.hoTen) + '</td><td>' + esc(a.username) + '</td></tr>'; }).join('') + '</table></div>' : ''),
        (j.added.length ? '<button class="btn grow" id="cpu">Sao chép danh sách</button>' : '') + '<button class="btn pri grow" data-x>Xong</button>',
        function (m) { var b = m.querySelector('#cpu'); if (b) b.onclick = function () { copyText('Tài khoản ứng dụng Mượn thiết bị (mật khẩu ban đầu 123456):\n' + txt); }; });
    });
  }

  start();
})();

</script>
</body>
</html>
